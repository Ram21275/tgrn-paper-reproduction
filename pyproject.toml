[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgrn-paper-reproduction"
version = "0.1.0"
description = "Independent PyTorch implementation of the Text-guided Reconstruction Network"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "tqdm>=4.66"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
